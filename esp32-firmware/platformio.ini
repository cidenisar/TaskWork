; Ver README.md — build "esp32dev" es la de producción (8 lámparas + relé
; completos, sin monitor serie por USB); "esp32dev_debug" libera UART0
; para depurar por USB a cambio de deshabilitar la lámpara de PROG4 y el
; relé (ver src/pines.h, nota de presupuesto de pines).

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Sin dependencias externas a propósito (ver src/protocolo.h) — nada que
; bajar de un registro además del propio framework de Arduino-ESP32.
lib_deps =

[env:esp32dev]
; Build de producción.

[env:esp32dev_debug]
build_flags = -D DEBUG_SERIAL
